<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Márgenes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #007bff; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input[type="number"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background-color: #007bff; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .results { border-top: 2px solid #ccc; padding-top: 15px; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; }
        .result-item strong { color: #007bff; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💲 Calculadora de Márgenes</h1>

        <form method="POST">
            <label for="costo">Ingresa el Costo Base del Producto:</label>
            <input type="number" step="0.01" name="costo" id="costo" required 
                   placeholder="Ej: 150.75" 
                   value="{{ costo if costo is not none else '' }}">
            <button type="submit">Calcular</button>
        </form>

        {% if resultados %}
            <div class="results">
                {% if "Error" in resultados %}
                    <p class="error">{{ resultados.Error }}</p>
                {% else %}
                    <h2>Resultados:</h2>
                    {% for etiqueta, valor in resultados.items() %}
                        <div class="result-item">
                            <span>{{ etiqueta }}:</span>
                            <strong>{{ valor }}</strong>
                        </div>
                    {% endfor %}
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
